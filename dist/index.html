    <header class="history-header"><h2 id="historyTitle" data-i18n="行动记录">行动记录</h2><button id="historyLatestBtn" data-i18n="最新一步" type="button">最新一步</button><button id="closeHistoryBtn" data-i18n="返回对局" type="button">返回对局</button></header>
    <div class="history-scroll"><table class="history-table"><thead><tr><th scope="col" data-i18n="回合 · 阵营">回合 · 阵营</th><th scope="col" data-i18n="行动与结果">行动与结果</th><th scope="col" data-i18n="消耗">消耗</th></tr></thead><tbody id="historyRows"></tbody></table><p id="historyEmpty" data-i18n="对局开始后，每一步行动都会记录在这里。" class="history-empty">对局开始后，每一步行动都会记录在这里。</p></div>
    <div class="history-detail" id="historyDetail" tabindex="-1" aria-label="行动前后的场面" data-i18n-aria="行动前后的场面"></div>
  </section>
</div>
<div class="overlay faction-overlay" id="factionOverlay">
  <section class="faction-dialog" role="dialog" aria-modal="true" aria-labelledby="factionTitle">
    <div class="faction-kicker">KARDS: Long Telegram</div>
    <h1 id="factionTitle" data-i18n="deck.title">组建你的卡组</h1>
    <div id="deckBuilder">
      <div class="nation-setup"><section><h2 data-i18n="deck.main"></h2><div id="mainChoices" class="nation-choices"></div></section><section><h2 data-i18n="deck.ally"></h2><div id="allyChoices" class="nation-choices"></div></section></div>
      <p class="deck-change-hint" data-i18n="deck.changeHint"></p>
      <section class="hq-setup"><h2 data-i18n="deck.hq"></h2><div id="hqChoices" class="hq-choices"></div></section>
      <div class="deck-toolbar"><h2 data-i18n="deck.cards"></h2><button id="presetDeckBtn" type="button" data-i18n="deck.preset"></button><button id="clearDeckBtn" type="button" data-i18n="deck.clear"></button></div>
      <div class="deck-summary"><strong id="deckTotal" aria-live="polite"></strong><span id="deckNationCount"></span><span data-i18n="deck.rule"></span></div>
      <div class="deck-columns"><section class="collection-panel"><h3 data-i18n="deck.collection"></h3><div class="deck-filters"><input id="deckSearch" type="search" data-i18n-aria="deck.search"><label><span data-i18n="deck.nationFilter"></span><select id="deckNationFilter" data-i18n-aria="deck.nationFilter"></select></label><label><span data-i18n="deck.costFilter"></span><select id="deckCostFilter" data-i18n-aria="deck.costFilter"></select></label><label><span data-i18n="deck.rarityFilter"></span><select id="deckRarityFilter" data-i18n-aria="deck.rarityFilter"></select></label></div><div id="cardCatalog" class="catalog-list"></div></section><section class="chosen-panel"><h3 data-i18n="deck.selected"></h3><div id="chosenDeck" class="chosen-list"></div></section></div>
      <p id="deckIssue" role="status"></p>
    </div>
    <p class="matchup" id="matchupText"></p>
    <div class="faction-actions"><button id="cancelFactionBtn" data-i18n="继续当前对局" class="secondary" type="button" hidden>继续当前对局</button><button id="startMatchBtn" type="button">开始对局</button></div>
  </section>
</div>
